<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LibraryHub | Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="sticky top-0 z-40 glass border-b border-slate-200 dark:border-slate-800">
    <nav class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="font-bold">LibraryHub Admin</a>
      <div class="flex gap-3 text-sm"><a href="books.html">Books</a><a href="borrow.html">Borrow</a><button id="themeToggle" class="w-9 h-9 rounded-lg border"></button></div>
    </nav>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-10 space-y-8">
    <section class="book-card rounded-2xl p-6">
      <h1 class="text-2xl font-bold mb-4">Add New Book</h1>
      <form id="addBookForm" class="grid md:grid-cols-2 gap-3">
        <input name="title" required placeholder="Title" class="px-3 py-2 rounded border bg-transparent" />
        <input name="author" required placeholder="Author" class="px-3 py-2 rounded border bg-transparent" />
        <input name="category" required placeholder="Category" class="px-3 py-2 rounded border bg-transparent" />
        <input name="image" placeholder="Image path (optional)" class="px-3 py-2 rounded border bg-transparent" />
        <textarea name="description" placeholder="Description" class="md:col-span-2 px-3 py-2 rounded border bg-transparent"></textarea>
        <button class="md:col-span-2 px-4 py-2 rounded bg-blue-600 text-white">Add Book</button>
      </form>
    </section>

    <section class="book-card rounded-2xl p-6 overflow-auto">
      <h2 class="text-xl font-semibold mb-4">Manage Books</h2>
      <table class="w-full min-w-[700px] text-sm">
        <thead><tr class="text-left border-b"><th class="p-2">ID</th><th class="p-2">Title</th><th class="p-2">Author</th><th class="p-2">Category</th><th class="p-2">Status</th><th class="p-2">Action</th></tr></thead>
        <tbody id="booksTableBody"></tbody>
      </table>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
